    // 2. Supabase Configuration (Ensure you put your actual credentials here)
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_PUBLIC_KEY";
    let supabaseClient = null;

    if (typeof supabase !== 'undefined' && SUPABASE_URL !== "https://YOUR_PROJECT_ID.supabase.co") {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // 3. Port Data Update Function
    function updatePortData() {
      const portSelect = document.getElementById("portSelect");
      if (!portSelect) return;
      const selected = portSelect.value;
      const data = portData[selected];

      if (data) {
        const walkEl = document.getElementById("walkTime");
        const taxiEl = document.getElementById("taxiAvg");
        const currEl = document.getElementById("currency");
        const safeEl = document.getElementById("safetyNotice");
        const tourList = document.getElementById("tourList");

        if (walkEl) walkEl.innerText = data.walkTime;
        if (taxiEl) taxiEl.innerText = data.taxiAvg;
        if (currEl) currEl.innerText = data.currency;
        if (safeEl) safeEl.innerHTML = `<strong>Plain-English Safety Tip:</strong> ${data.safety}`;

        if (tourList) {
          tourList.innerHTML = "";
          data.tours.forEach(tour => {
            tourList.innerHTML += `
              <li style="padding: 0.75rem 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <strong>${tour.name}</strong><br>
                  <small style="color: #64748b;">Duration: ${tour.time}</small>
                </div>
                <a href="#" class="btn" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem;">Book (${tour.price})</a>
              </li>
            `;
          });
        }
      }
    }

    // 4. Return Calculator Function
    function calculateReturnTime() {
      const allAboardInput = document.getElementById("allAboard");
      const distanceInput = document.getElementById("distanceMin");
      const calcOutput = document.getElementById("calcOutput");

      if (!allAboardInput || !distanceInput || !calcOutput) return;

      const allAboardVal = allAboardInput.value;
      const distanceMin = parseInt(distanceInput.value) || 0;

      if (!allAboardVal) return;

      const [hours, minutes] = allAboardVal.split(":").map(Number);
      let allAboardDate = new Date();
      allAboardDate.setHours(hours, minutes, 0);

      const totalBuffer = distanceMin + 45;
      let departureDate = new Date(allAboardDate.getTime() - totalBuffer * 60000);

      let options = { hour: 'numeric', minute: '2-digit', hour12: true };
      let formattedTime = departureDate.toLocaleTimeString([], options);

      calcOutput.innerHTML = `
        Must start heading back by: <span style="color: #b91c1c;">${formattedTime}</span>
        <br><small style="font-weight: normal; font-size: 0.8rem; color: #374151;">(Includes ${distanceMin}m travel time + 45m port security/line cushion)</small>
      `;
    }

    // 5. Supabase Fetch Sightings
    async function fetchRoosterSightings() {
      const feed = document.getElementById("sightingFeed");
      if (!feed) return;

      if (!supabaseClient) {
        feed.innerHTML = `
          <div class="sighting-item">
            <strong>"Sir Clucks-A-Lot" @ Nassau Pier</strong><br>
            "Crowed directly outside my balcony at 4:12 AM sharp."
            <div class="sighting-time">12 mins ago</div>
          </div>
        `;
        return;
      }

      const { data: sightings, error } = await supabaseClient
        .from("rooster_sightings")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(10);

      if (error) {
        console.error("Error fetching sightings:", error);
        return;
      }

      if (sightings && sightings.length > 0) {
        feed.innerHTML = "";
        sightings.forEach(item => {
          const timeAgo = new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          feed.innerHTML += `
            <div class="sighting-item">
              <strong>"Sighting" @ ${item.location}</strong><br>
              "${item.detail}"
              <div class="sighting-time">${timeAgo}</div>
            </div>
          `;
        });
      }
    }

    // 6. Supabase Report Sighting Function
    async function reportRooster() {
      const location = prompt("Enter the Island / Port location:");
      if (!location) return;

      const detail = prompt("What was the rooster doing?");
      if (!detail) return;

      if (supabaseClient) {
        const { error } = await supabaseClient
          .from("rooster_sightings")
          .insert([{ location: location, detail: detail }]);

        if (error) {
          alert("Error saving sighting: " + error.message);
        } else {
          fetchRoosterSightings();
        }
      } else {
        const feed = document.getElementById("sightingFeed");
        if (feed) {
          const newItem = document.createElement("div");
          newItem.className = "sighting-item";
          newItem.innerHTML = `
            <strong>"New Sighting" @ ${location}</strong><br>
            "${detail}"
            <div class="sighting-time">Just now</div>
          `;
          feed.prepend(newItem);
        }
      }
    }

    // 7. Event Listener Initializations
    document.addEventListener("DOMContentLoaded", function() {
      const portSelect = document.getElementById("portSelect");
      const allAboard = document.getElementById("allAboard");
      const distanceMin = document.getElementById("distanceMin");

      if (portSelect) portSelect.addEventListener("change", updatePortData);
      if (allAboard) allAboard.addEventListener("change", calculateReturnTime);
      if (distanceMin) distanceMin.addEventListener("input", calculateReturnTime);

      updatePortData();
      calculateReturnTime();
      fetchRoosterSightings();
    });
  </script>
